# HAProxy for docker-compose.replicas.yml: active readiness checks per replica found through
# Docker's DNS, round robin, and retries only where a request cannot have run twice.
global
    log stdout format raw local0

defaults
    mode http
    log global
    option httplog
    timeout connect 2s
    timeout client 30s
    # A replica whose database froze ends ordinary work at 14s; the
    # proxy gives up first, so a client gets 504 within 8s instead of waiting.
    timeout server 8s
    timeout http-request 15s
    timeout check 1s
    # A request that never reached a replica (refused connection) may go to another one; an
    # empty response (a replica that died mid-request) is retried for GET/HEAD only, below,
    # so a POST is never sent twice. A timed-out request is never retried: it would wait again.
    retries 2
    option redispatch 1
    retry-on conn-failure empty-response

resolvers docker
    nameserver docker 127.0.0.11:53
    accepted_payload_size 8192
    timeout resolve 1s
    timeout retry 1s
    hold valid 2s
    hold other 2s
    hold refused 2s
    hold nx 2s
    hold timeout 2s
    hold obsolete 2s

frontend web
    bind :8080
    default_backend replicas

backend replicas
    balance roundrobin
    # The replicas trust only this proxy (KY_TRUSTED_PROXIES); it appends the peer it saw.
    option forwardfor
    http-request disable-l7-retry unless METH_GET || METH_HEAD
    # Capsule export, drill and deposit may take minutes (the server's own budget is 16m).
    http-request set-timeout server 16m if { path /api/backup/deposit /api/backup/drill /api/backup/export-capsule }
    option httpchk
    http-check send meth GET uri /readyz
    http-check expect status 200
    default-server check inter 1s fall 2 rise 2 resolvers docker resolve-prefer ipv4 init-addr none
    # One slot per replica of the "app" service (KY_REPLICAS), filled as Docker's DNS changes.
    server-template app "${KY_REPLICAS}" app:8080
