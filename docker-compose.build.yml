# Source build. Set it once so every `docker compose` command, the recovery
# procedure included, keeps using the local build instead of the published image:
#   echo 'COMPOSE_FILE=docker-compose.yml:docker-compose.build.yml' >> .env
# Or layer it per command: docker compose -f docker-compose.yml -f docker-compose.build.yml ...
# The result is tagged ky_server_base:local so it never occupies the published name.
services:
  app:
    image: ky_server_base:local
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile
