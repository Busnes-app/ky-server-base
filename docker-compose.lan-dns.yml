# Optional override: send the container's DNS lookups to your LAN's resolver, so names that
# exist only there (a KyRecovery behind your own proxy) resolve inside the container. It
# replaces the host's resolvers for every lookup this container makes, which is why it is
# not in the base file. Select it by adding it to COMPOSE_FILE in .env, never with -f: an
# explicit -f list replaces COMPOSE_FILE outright and would drop a source install's build
# overlay. The resolver and the private-recovery flag live in .env too, since every later compose
# command recreates the container from .env. The lines are replaced in place, never appended.
# The flag persists in .env on its own: to undo, remove it and the resolver (README shows the
# revert) rather than only dropping this file from COMPOSE_FILE.
# Pick ONE, then: docker compose up -d --force-recreate
#   (umask 077; t=$(mktemp ./.env.XXXXXX) && touch .env && { grep -v -e '^COMPOSE_FILE=' -e '^KY_DNS=' -e '^KY_BACKUP_ALLOW_PRIVATE_RECOVERY=' .env || [ $? -eq 1 ]; } > "$t" && printf 'COMPOSE_FILE=docker-compose.yml:docker-compose.lan-dns.yml\nKY_DNS=192.168.1.1\nKY_BACKUP_ALLOW_PRIVATE_RECOVERY=true\n' >> "$t" && mv "$t" .env)   # published image
#   (umask 077; t=$(mktemp ./.env.XXXXXX) && touch .env && { grep -v -e '^COMPOSE_FILE=' -e '^KY_DNS=' -e '^KY_BACKUP_ALLOW_PRIVATE_RECOVERY=' .env || [ $? -eq 1 ]; } > "$t" && printf 'COMPOSE_FILE=docker-compose.yml:docker-compose.build.yml:docker-compose.lan-dns.yml\nKY_DNS=192.168.1.1\nKY_BACKUP_ALLOW_PRIVATE_RECOVERY=true\n' >> "$t" && mv "$t" .env)   # source install
services:
  app:
    dns:
      - ${KY_DNS:?set KY_DNS to your LAN DNS server}
